<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>
  <!-- Background Rounded Rect -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>
  <rect x="12" y="12" width="488" height="488" rx="98" fill="none" stroke="#334155" stroke-width="4"/>
  
  <!-- Receipt Outline -->
  <path d="M 140 100 L 372 100 L 372 410 L 343 392 L 314 410 L 285 392 L 256 410 L 227 392 L 198 410 L 169 392 L 140 410 Z" 
        fill="#f8fafc" stroke="#cbd5e1" stroke-width="8" stroke-linejoin="round"/>
  
  <!-- Receipt Header Lines -->
  <rect x="180" y="145" width="152" height="14" rx="7" fill="#64748b"/>
  <rect x="206" y="172" width="100" height="10" rx="5" fill="#94a3b8"/>
  <line x1="170" y1="205" x2="342" y2="205" stroke="#e2e8f0" stroke-width="3" stroke-dasharray="6,6"/>

  <!-- Mini Chart inside Receipt -->
  <path d="M 180 290 L 220 265 L 260 275 L 300 235 L 332 245" 
        fill="none" stroke="url(#accentGrad)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="300" cy="235" r="7" fill="#10b981"/>
  <circle cx="332" cy="245" r="7" fill="#10b981"/>

  <!-- Price Tag Floating Badge -->
  <g transform="translate(280, 290)">
    <circle cx="70" cy="70" r="65" fill="url(#blueGrad)" filter="drop-shadow(0 10px 15px rgba(0,0,0,0.3))"/>
    <text x="70" y="86" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="900" fill="#ffffff" text-anchor="middle">$</text>
  </g>

  <!-- Camera / AI Sparkle Icon -->
  <path d="M 175 330 L 180 345 L 195 350 L 180 355 L 175 370 L 170 355 L 155 350 L 170 345 Z" fill="#f59e0b"/>
  <path d="M 215 320 L 218 328 L 226 331 L 218 334 L 215 342 L 212 334 L 204 331 L 212 328 Z" fill="#fbbf24"/>
</svg>